name: reproduce

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['8.0.2', '8.10.7', '9.4.8', '9.8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'
      - name: Build
        shell: bash   # bash -eo pipefail, so a failed build is not hidden by tee
        run: cabal build all 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ghc-${{ matrix.ghc }}
          path: build.log

  run-main:
    name: run Main (Appendix B)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.4.8']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Build
        run: cabal build exe:main
      - name: Run Main twice and time it
        run: |
          mkdir -p ci-out
          /usr/bin/time -v $(cabal list-bin exe:main) +RTS -s -RTS > ci-out/appendixB.tex 2> ci-out/run1.stderr
          $(cabal list-bin exe:main) > ci-out/appendixB.run2.tex
          cmp ci-out/appendixB.tex ci-out/appendixB.run2.tex && echo "deterministic: identical" | tee ci-out/determinism.txt
      - name: Compare with thesis Appendix B
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 scripts/compare_appendixB.py ci-out/appendixB.tex Foundations.pdf | tee ci-out/appendixB_comparison.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appendixB-ghc-${{ matrix.ghc }}
          path: ci-out/
      - name: Publish results to branch ci-results-main
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-results-main
          git rm -rf --cached . -q
          git add -f ci-out
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -f origin ci-results-main

  run-lemmas:
    name: run Test.hs lemma suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      - name: Build
        run: cabal build exe:test-lemmas exe:check-lemmas
      - name: Check which lemmas are proved (fails if any is unproved)
        shell: bash
        run: |
          mkdir -p ci-out
          $(cabal list-bin exe:check-lemmas) | tee ci-out/check_lemmas.txt
      - name: Run provelemas 30
        run: |
          mkdir -p ci-out
          /usr/bin/time -v $(cabal list-bin exe:test-lemmas) +RTS -s -RTS > ci-out/provelemas.txt 2> ci-out/provelemas.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lemmas
          path: ci-out/
      - name: Publish results to branch ci-results-lemmas
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-results-lemmas
          git rm -rf --cached . -q
          git add -f ci-out
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -f origin ci-results-lemmas

  run-experiments:
    name: run experiments (timings, flipexp)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      - name: Build
        shell: bash
        run: |
          mkdir -p ci-out
          cabal build exe:experiments 2>&1 | tee ci-out/build.log
          exit ${PIPESTATUS[0]}
      - name: Run experiments
        run: |
          mkdir -p ci-out
          /usr/bin/time -v $(cabal list-bin exe:experiments) +RTS -s -RTS > ci-out/experiments.txt 2> ci-out/experiments.stderr
      - name: Publish results to branch ci-results-experiments
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-results-experiments
          git rm -rf --cached . -q
          git add -f ci-out
          git commit -q -m "CI results for ${{ github.sha }}"
          git push -f origin ci-results-experiments
