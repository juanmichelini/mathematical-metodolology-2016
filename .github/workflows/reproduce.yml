name: reproduce

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: build (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['8.0.2', '8.10.7', '9.4.8', '9.8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'
      - name: Build
        run: cabal build all 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ghc-${{ matrix.ghc }}
          path: build.log

  run-main:
    name: run Main (Appendix B)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.4.8']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Build
        run: cabal build exe:main
      - name: Run Main twice and time it
        run: |
          mkdir -p results
          /usr/bin/time -v $(cabal list-bin exe:main) +RTS -s -RTS > results/appendixB.tex 2> results/run1.stderr
          $(cabal list-bin exe:main) > results/appendixB.run2.tex
          cmp results/appendixB.tex results/appendixB.run2.tex && echo "deterministic: identical" | tee results/determinism.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appendixB-ghc-${{ matrix.ghc }}
          path: results/

  run-lemmas:
    name: run Test.hs lemma suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      - name: Build
        run: cabal build exe:test-lemmas
      - name: Run provelemas 30
        run: |
          mkdir -p results
          /usr/bin/time -v $(cabal list-bin exe:test-lemmas) +RTS -s -RTS > results/provelemas.txt 2> results/provelemas.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lemmas
          path: results/
