name: iterate

on:
  push:
    branches: ['iterate-*']

permissions:
  contents: write

jobs:
  search:
    name: search ${{ matrix.ks }} (shard ${{ matrix.shard }}/${{ matrix.shards }})
    if: startsWith(github.ref_name, 'iterate-run')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ks: '3,12,24', shard: 0, shards: 3 }
          - { ks: '3,12,24', shard: 1, shards: 3 }
          - { ks: '3,12,24', shard: 2, shards: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      - name: Build
        shell: bash
        run: |
          mkdir -p ci-out
          cabal build exe:iterate-search 2>&1 | tee ci-out/build.log
          exit ${PIPESTATUS[0]}
      - name: Search (CPU budget 55 min, hard cap 58 min)
        shell: bash
        run: |
          set +e
          timeout 3480 $(cabal list-bin exe:iterate-search) run ${{ matrix.shard }} ${{ matrix.shards }} 3300 ${{ matrix.ks }} 2>&1 | tee ci-out/run.txt
          echo "exit status: ${PIPESTATUS[0]} (124 = hit the hard cap)" | tee -a ci-out/run.txt
          exit 0
      - name: Publish results
        if: always()
        shell: bash
        run: |
          tag=$(echo "${{ matrix.ks }}" | tr ',' '_')-s${{ matrix.shard }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-results-run1-$tag
          git rm -rf --cached . -q
          git add -f ci-out
          git commit -q -m "search results for ${{ github.sha }}"
          git push -f origin ci-results-run1-$tag

  probe:
    name: probe candidate count (${{ matrix.ks }})
    if: startsWith(github.ref_name, 'iterate-run')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ks: ['3,5,7,12,24,25,27', '3,4,5,6,7,8,9,10,12,13,15,16,19,24,25,26,27,29']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
      - name: Build
        shell: bash
        run: |
          mkdir -p ci-out
          cabal build exe:iterate-search 2>&1 | tee ci-out/build.log
          exit ${PIPESTATUS[0]}
      - name: Count candidates (20 minute cap)
        shell: bash
        run: |
          set +e
          timeout 1200 $(cabal list-bin exe:iterate-search) count ${{ matrix.ks }} 2>&1 | tee ci-out/count.txt
          echo "exit status: ${PIPESTATUS[0]} (124 = hit the cap before the count finished)" | tee -a ci-out/count.txt
          exit 0
      - name: Publish results
        if: always()
        shell: bash
        run: |
          tag=$(echo "${{ matrix.ks }}" | tr ',' '_' | cut -c1-40)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-results-probe-$tag
          git rm -rf --cached . -q
          git add -f ci-out
          git commit -q -m "probe results for ${{ github.sha }}"
          git push -f origin ci-results-probe-$tag
